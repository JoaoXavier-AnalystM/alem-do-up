apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: db:5432
    user: $__env{APP_DB_USER}
    jsonData:
      database: $__env{APP_DB_NAME}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
    secureJsonData:
      password: $__env{APP_DB_PASSWORD}
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    basicAuth: true
    basicAuthUser: $__env{ZABBIX_API_USER}
    jsonData:
      tlsSkipVerify: true
      trends: true
      cacheTTL: 1h
    secureJsonData:
      basicAuthPassword: $__env{ZABBIX_API_PASSWORD}
