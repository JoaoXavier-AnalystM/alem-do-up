events {}
http {
  log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$upstream_request_id",'
    '"remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';
  access_log /dev/stdout json_combined;

  map $http_x_request_id $upstream_request_id {
    default $http_x_request_id;
    "" $request_id;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $upstream_request_id;
      proxy_hide_header X-Request-ID;
      add_header X-Request-ID $upstream_request_id always;
      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
    }
  }
}
