<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loja — checkout</title>
<style>:root{color-scheme:dark;--card:#17203b;--line:#35456f;--text:#f7f9ff;--muted:#aeb9d7;--accent:#88adff;--ok:#7be495;--bad:#ff7184}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2a51,#0c1224 55%);color:var(--text);font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:42px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:800;color:var(--accent)}a{color:var(--accent);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 70px #02061566}.product{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:22px}.product h1{font-size:30px;margin:0 0 6px}.product p,.note{color:var(--muted);margin:0}.price{font-size:28px;font-weight:800;white-space:nowrap}.buy{width:100%;padding:14px;border:0;border-radius:10px;background:#416bc5;color:white;font-weight:800;font-size:16px;cursor:pointer}.buy:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:22px;padding:17px;border-radius:12px;background:#0a1020;border:1px solid var(--line)}.result.show{display:block}.result.ok{border-color:var(--ok)}.result.bad{border-color:var(--bad)}.result strong{display:block;font-size:22px;margin-bottom:5px}.footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:560px){.product{display:block}.price{margin-top:16px}}</style></head>
<body><main><div class="top"><div class="brand">● Aplicação web</div><a href="/">Visão da demonstração</a></div><section class="card"><div class="product"><div><h1>Pedido de demonstração</h1><p>Uma compra simples para sentir a experiência real do checkout.</p></div><div class="price">R$ 49,90</div></div><p class="note">Quantidade <strong>1</strong></p><button id="buy" class="buy">Finalizar compra</button><div id="result" class="result"><strong id="title"></strong><span id="detail"></span></div></section><p class="footer">Esta tela é para usuários. Os detalhes técnicos ficam na visão da demonstração.</p></main>
<script>const buy=document.getElementById('buy'),result=document.getElementById('result'),title=document.getElementById('title'),detail=document.getElementById('detail');buy.onclick=async()=>{buy.disabled=true;buy.textContent='Processando...';const start=performance.now();try{const r=await fetch('/checkout'),elapsed=Math.round(performance.now()-start),d=await r.json().catch(()=>({}));result.className='result show '+(r.ok?'ok':'bad');if(r.ok){title.textContent=elapsed>700?'Está demorando':'Compra aprovada';detail.textContent=elapsed>700?`A compra respondeu em ${elapsed} ms.`:'Pedido confirmado.'}else if(r.status===503&&d.detail?.includes('unavailable')){title.textContent='Serviço indisponível';detail.textContent='Não foi possível finalizar agora.'}else{title.textContent='Não foi possível concluir';detail.textContent='Tente novamente em instantes.'}}catch{result.className='result show bad';title.textContent='Serviço indisponível';detail.textContent='Não foi possível conectar ao checkout.'}finally{buy.disabled=false;buy.textContent='Finalizar compra'}};</script></body></html>
