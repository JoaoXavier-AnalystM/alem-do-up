<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro — aplicação</title>
<style>:root{color-scheme:dark;--card:#17203b;--line:#35456f;--text:#f7f9ff;--muted:#aeb9d7;--accent:#88adff;--ok:#7be495;--bad:#ff7184}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2a51,#0c1224 55%);color:var(--text);font:16px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:42px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:800;color:var(--accent)}a{color:var(--accent);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 70px #02061566}.card h1{font-size:30px;margin:0 0 7px}.card>p{color:var(--muted);margin:0 0 24px}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;color:var(--muted);font-size:14px}.form input{width:100%;border:1px solid var(--line);border-radius:9px;background:#0a1020;color:var(--text);padding:13px;font:inherit}.submit{padding:14px;border:0;border-radius:10px;background:#416bc5;color:white;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:22px;padding:17px;border-radius:12px;background:#0a1020;border:1px solid var(--line)}.result.show{display:block}.result.ok{border-color:var(--ok)}.result.bad{border-color:var(--bad)}.result strong{display:block;font-size:22px;margin-bottom:5px}.hint{margin-top:18px;color:var(--muted);font-size:13px}.footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}</style></head>
<body><main><div class="top"><div class="brand">● Aplicação web</div><a href="/">Visão da demonstração</a></div><section class="card"><h1>Complete seu cadastro</h1><p>Preencha seus dados para continuar.</p><form id="form" class="form"><label>Nome<input name="name" required autocomplete="name" placeholder="Seu nome"></label><label>Idade<input name="age" type="number" min="1" max="120" required placeholder="Sua idade"></label><label>Cargo / profissão<input name="profession" required autocomplete="organization-title" placeholder="Sua profissão"></label><button id="submit" class="submit">Continuar</button></form><div id="result" class="result"><strong id="title"></strong><span id="detail"></span></div><p class="hint">A experiência muda conforme o sistema recebe mais cadastros.</p></section><p class="footer">Esta tela representa a jornada do usuário.</p></main>
<script>const form=document.getElementById('form'),button=document.getElementById('submit'),result=document.getElementById('result'),title=document.getElementById('title'),detail=document.getElementById('detail');form.onsubmit=async event=>{event.preventDefault();button.disabled=true;button.textContent='Enviando...';const start=performance.now();try{const payload=Object.fromEntries(new FormData(form));payload.age=Number(payload.age);const response=await fetch('/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),elapsed=Math.round(performance.now()-start),data=await response.json().catch(()=>({}));result.className='result show '+(response.ok?'ok':'bad');if(response.ok){title.textContent=elapsed>700?'Está demorando':'Cadastro recebido';detail.textContent=elapsed>700?`A resposta levou ${elapsed} ms.`:'Tudo certo. Você pode continuar.'}else if(response.status===503&&data.detail?.includes('unavailable')){title.textContent='Serviço indisponível';detail.textContent='O sistema está temporariamente fora do ar.'}else if(response.status===503){title.textContent='Problema para continuar';detail.textContent='O sistema está sob pressão. Tente novamente.'}else{title.textContent='Não foi possível concluir';detail.textContent='Revise os dados e tente novamente.'}}catch{result.className='result show bad';title.textContent='Serviço indisponível';detail.textContent='Não foi possível conectar à aplicação.'}finally{button.disabled=false;button.textContent='Continuar'}};</script></body></html>
