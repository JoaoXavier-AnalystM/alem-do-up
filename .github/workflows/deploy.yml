name: Deploy to VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_KEY"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload application
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=presentation/captures \
            -czf - . |
            ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "mkdir -p '$VPS_APP_DIR' && tar -xzf - -C '$VPS_APP_DIR'"

      - name: Build and restart stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' \
            -- "$VPS_APP_DIR" <<'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR="$1"
          cd "$APP_DIR"

          # O laboratório usa os valores preenchidos no .env.example em todo deploy.
          cp .env.example .env
          echo "Atualizado .env a partir de .env.example"

          for variable in APP_DB_PASSWORD ZBX_DB_PASSWORD GRAFANA_ADMIN_PASSWORD ZABBIX_API_USER ZABBIX_API_PASSWORD; do
            if ! grep -Eq "^${variable}=.+$" .env; then
              echo "Variável obrigatória ausente ou vazia no .env: ${variable}" >&2
              exit 1
            fi
          done

          chmod +x scripts/*.sh
          export DOCKER_BUILDKIT=1
          COMPOSE="docker compose --profile zabbix"

          # Migração dos nomes antigos; volumes e dados permanecem intactos.
          for old_container in checkout-db checkout-api checkout-nginx checkout-prometheus checkout-grafana checkout-loki checkout-promtail checkout-jaeger checkout-otel-collector checkout-zabbix-db checkout-zabbix-server checkout-zabbix-web checkout-zabbix-agent2; do
            docker rm -f "$old_container" 2>/dev/null || true
          done

          # Sobe primeiro a infraestrutura que não depende da API.
          $COMPOSE up -d --remove-orphans --no-build db zabbix-db jaeger loki prometheus promtail otel-collector

          # A API é a única imagem local compilada e espera o banco saudável.
          $COMPOSE up -d --build api

          # Só depois inicia o proxy e as camadas que dependem da infraestrutura.
          $COMPOSE up -d --remove-orphans --no-build nginx grafana zabbix-server zabbix-web zabbix-agent2

          $COMPOSE ps
          ./scripts/smoke.sh
          REMOTE_SCRIPT
