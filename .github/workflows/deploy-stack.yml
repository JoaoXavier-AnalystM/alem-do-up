name: Deploy Stack

on:
  push:
    branches: [master, main]
    paths:
      - "opendockwatch/**"
      - ".github/workflows/deploy-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-opendockwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_KEY"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload OpenDockWatch
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=data \
            -czf - -C opendockwatch . |
            ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "mkdir -p '$VPS_APP_DIR/opendockwatch' && tar -xzf - -C '$VPS_APP_DIR/opendockwatch'"

      - name: Configure and restart OpenDockWatch
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' \
            -- "$VPS_APP_DIR" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT_DIR="$1"
          STACK_DIR="$ROOT_DIR/opendockwatch"
          cd "$ROOT_DIR"

          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          test -f .env
          auth_user="$(awk -F= '/^GRAFANA_ADMIN_USER=/{print substr($0, index($0, "=") + 1)}' .env | tr -d '\r')"
          auth_password="$(awk -F= '/^GRAFANA_ADMIN_PASSWORD=/{print substr($0, index($0, "=") + 1)}' .env | tr -d '\r')"
          test -n "$auth_user"
          test -n "$auth_password"

          mkdir -p "$STACK_DIR/data"
          if [ ! -f "$STACK_DIR/config/hosts.json" ]; then
            cp "$STACK_DIR/config/hosts.example.json" "$STACK_DIR/config/hosts.json"
          fi

          session_secret=""
          if [ -f "$STACK_DIR/.env" ]; then
            session_secret="$(awk -F= '/^SESSION_SECRET=/{print substr($0, index($0, "=") + 1)}' "$STACK_DIR/.env" | tr -d '\r')"
          fi
          if [ -z "$session_secret" ]; then
            session_secret="$(openssl rand -hex 32)"
          fi

          image="darks1d3r/opendockwatch:2.7.0"
          auth_hash="$(docker run --rm "$image" node scripts/hash-password.js "$auth_password")"
          umask 077
          cat > "$STACK_DIR/.env" <<EOF
          AUTH_USER=$auth_user
          AUTH_PASS_HASH=$auth_hash
          SESSION_SECRET=$session_secret
          TRUST_PROXY=false
          OPENDOCKWATCH_PORT=3001
          EOF

          cd "$STACK_DIR"

          mkdir -p data
          if [ ! -f config/hosts.json ]; then
            cp config/hosts.example.json config/hosts.json
          fi

          chmod 600 .env
          chmod +x scripts/*.sh
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE_SCRIPT
