name: ${COMPOSE_PROJECT_NAME:-up-but-not-healthy}

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-hardening: &hardening
  init: true
  security_opt: [no-new-privileges:true]

services:
  db:
    container_name: db-up
    image: ${APP_DB_IMAGE:-timescale/timescaledb:latest-pg17}
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ${APP_DB_USER} -d ${APP_DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./demo/db/initdb:/docker-entrypoint-initdb.d:ro
    networks: [lab]
  api:
    container_name: api-up
    build: ./demo/api
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      INCIDENT_HOLD_SECONDS: ${INCIDENT_HOLD_SECONDS:-8}
      DEMO_DEGRADED_AFTER: ${DEMO_DEGRADED_AFTER:-5}
      DEMO_CRITICAL_AFTER: ${DEMO_CRITICAL_AFTER:-12}
      DEMO_OFFLINE_AFTER: ${DEMO_OFFLINE_AFTER:-22}
      OTEL_SERVICE_NAME: checkout-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    expose: ["8000"]
    networks: [lab]
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["${APP_PORT:-5055}:80"]
    volumes: ["./demo/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: {api: {condition: service_healthy}}
    networks: [lab]
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    ports: ["9090:9090"]
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    networks: [lab]
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:12.3.1-security-01
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes: ["grafana_data:/var/lib/grafana", "./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    depends_on: [prometheus, loki, jaeger]
    networks: [lab]
  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: ["./observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro"]
    networks: [lab]
  promtail:
    container_name: promtail
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./observability/promtail/config.yml:/etc/promtail/config.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro"]
    depends_on: [loki]
    networks: [lab]
  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    networks: [lab]
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: ["./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro"]
    depends_on: [jaeger]
    networks: [lab]
  zabbix-db:
    container_name: zabbix-db
    profiles: [zabbix]
    image: ${ZBX_DB_IMAGE:-postgres:17.7-alpine}
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${ZBX_DB_NAME}
      POSTGRES_USER: ${ZBX_DB_USER}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ${ZBX_DB_USER} -d ${ZBX_DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes: [zabbix_data:/var/lib/postgresql/data]
    networks: [lab]
  zabbix-server:
    container_name: zabbix-server
    profiles: [zabbix]
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    stop_grace_period: 30s
    tmpfs: [/tmp]
    depends_on: {zabbix-db: {condition: service_healthy}}
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZBX_DB_NAME}
      POSTGRES_USER: ${ZBX_DB_USER}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
    ports: ["${ZBX_SERVER_PORT}:10051"]
    networks: [lab]
  zabbix-web:
    container_name: zabbix-web
    profiles: [zabbix]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    tmpfs: [/tmp]
    depends_on:
      zabbix-db: {condition: service_healthy}
      zabbix-server: {condition: service_started}
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZBX_DB_NAME}
      POSTGRES_USER: ${ZBX_DB_USER}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: ${COMPOSE_PROJECT_NAME:-up-but-not-healthy}
      PHP_TZ: ${PHP_TZ:-America/Sao_Paulo}
    ports: ["${ZBX_WEB_PORT}:8080"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/ping]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s
    networks: [lab]
  zabbix-agent2:
    container_name: zabbix-agent2
    profiles: [zabbix]
    image: zabbix/zabbix-agent2:alpine-7.4-latest
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    depends_on: {zabbix-server: {condition: service_started}}
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_HOSTNAME: ${ZBX_HOSTNAME}
      ZBX_LISTENPORT: ${ZBX_AGENT_PORT}
      ZBX_PASSIVE_ALLOW: "true"
    ports: ["127.0.0.1:${ZBX_AGENT_PORT}:${ZBX_AGENT_PORT}"]
    networks: [lab]
volumes:
  postgres_data:
  grafana_data:
  zabbix_data:
networks:
  lab:
