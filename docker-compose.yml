name: ${COMPOSE_PROJECT_NAME:-up-but-not-healthy}

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-hardening: &hardening
  init: true
  security_opt: [no-new-privileges:true]

services:
  db:
    image: ${APP_DB_IMAGE:-timescale/timescaledb:latest-pg17}
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      POSTGRES_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ${APP_DB_USER:?Set APP_DB_USER in .env} -d ${APP_DB_NAME:?Set APP_DB_NAME in .env} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./demo/db/initdb:/docker-entrypoint-initdb.d:ro
    networks: [lab]
  api:
    build: ./demo/api
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      INCIDENT_HOLD_SECONDS: ${INCIDENT_HOLD_SECONDS:-8}
      OTEL_SERVICE_NAME: checkout-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: {db: {condition: service_healthy}}
    expose: ["8000"]
    networks: [lab]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["8080:80"]
    volumes: ["./demo/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]
    networks: [lab]
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["9090:9090"]
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    networks: [lab]
  grafana:
    image: grafana/grafana:12.1.3-security-01
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app:6.0.3
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      ZABBIX_API_USER: ${ZABBIX_API_USER:?Set ZABBIX_API_USER in .env}
      ZABBIX_API_PASSWORD: ${ZABBIX_API_PASSWORD:?Set ZABBIX_API_PASSWORD in .env}
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    depends_on: [prometheus, loki, jaeger]
    networks: [lab]
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: ["./observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro"]
    networks: [lab]
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./observability/promtail/config.yml:/etc/promtail/config.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]
    networks: [lab]
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    networks: [lab]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: ["./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro"]
    depends_on: [jaeger]
    networks: [lab]
  zabbix-db:
    profiles: [zabbix]
    image: ${ZBX_DB_IMAGE:-postgres:17.7-alpine}
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${ZBX_DB_NAME:?Set ZBX_DB_NAME in .env}
      POSTGRES_USER: ${ZBX_DB_USER:?Set ZBX_DB_USER in .env}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:?Set ZBX_DB_PASSWORD in .env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ${ZBX_DB_USER:?Set ZBX_DB_USER in .env} -d ${ZBX_DB_NAME:?Set ZBX_DB_NAME in .env} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes: [zabbix_data:/var/lib/postgresql/data]
    networks: [lab]
  zabbix-server:
    profiles: [zabbix]
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    stop_grace_period: 30s
    tmpfs: [/tmp]
    depends_on: {zabbix-db: {condition: service_healthy}}
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZBX_DB_NAME:?Set ZBX_DB_NAME in .env}
      POSTGRES_USER: ${ZBX_DB_USER:?Set ZBX_DB_USER in .env}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:?Set ZBX_DB_PASSWORD in .env}
    ports: ["${ZBX_SERVER_PORT:?Set ZBX_SERVER_PORT in .env}:10051"]
    networks: [lab]
  zabbix-web:
    profiles: [zabbix]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    tmpfs: [/tmp]
    depends_on:
      zabbix-db: {condition: service_healthy}
      zabbix-server: {condition: service_started}
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZBX_DB_NAME:?Set ZBX_DB_NAME in .env}
      POSTGRES_USER: ${ZBX_DB_USER:?Set ZBX_DB_USER in .env}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:?Set ZBX_DB_PASSWORD in .env}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: ${COMPOSE_PROJECT_NAME:-up-but-not-healthy}
      PHP_TZ: ${PHP_TZ:-America/Sao_Paulo}
    ports: ["${ZBX_WEB_PORT:?Set ZBX_WEB_PORT in .env}:8080"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/ping]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s
    networks: [lab]
  zabbix-agent2:
    profiles: [zabbix]
    image: zabbix/zabbix-agent2:ubuntu-7.4-latest
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on: {zabbix-server: {condition: service_started}}
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:?Set ZBX_HOSTNAME in .env}
      ZBX_LISTENPORT: ${ZBX_AGENT_PORT:?Set ZBX_AGENT_PORT in .env}
      ZBX_PASSIVE_ALLOW: "true"
    ports: ["127.0.0.1:${ZBX_AGENT_PORT:?Set ZBX_AGENT_PORT in .env}:${ZBX_AGENT_PORT:?Set ZBX_AGENT_PORT in .env}"]
    networks: [lab]
volumes:
  postgres_data:
  zabbix_data:
networks:
  lab:
